# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:
  list:
    desc: "Liste toutes les images utilisées dans docker-compose.yml"
    silent: true
    preconditions:
    - sh: command -v docker
      msg: "Docker n'est pas installé ou accessible"
    summary: |
      Extrait et affiche toutes les images définies dans un fichier docker-compose.yml.

      Variables:
      - COMPOSE_FILE: Chemin vers le fichier docker-compose (défaut: docker-compose.yml)

      Exemples:
      task docker:images:list
      task docker:images:list COMPOSE_FILE=docker-compose.prod.yml
    vars:
      COMPOSE_FILE: '{{.COMPOSE_FILE | default "docker-compose.yml"}}'
    cmds:
    - |
      if [ ! -f "{{.COMPOSE_FILE}}" ]; then
        echo "❌ Le fichier '{{.COMPOSE_FILE}}' n'existe pas"
        echo "📁 Fichiers docker-compose disponibles :"
        find . -name "docker-compose*.yml" -o -name "compose*.yml" 2>/dev/null || echo "   Aucun fichier docker-compose trouvé"
        exit 1
      fi

      echo "📋 Images extraites de '{{.COMPOSE_FILE}}' :"
      echo ""

      # Extraction des images avec yq si disponible (robuste aux ancres YAML/multiligne), sinon avec grep/sed
      if command -v yq >/dev/null 2>&1; then
        images=$(yq eval '.services.*.image' {{.COMPOSE_FILE}} 2>/dev/null | grep -v "null" | sort | uniq)
      else
        # Fallback sans yq : fragile sur ancres YAML/multiligne
        images=$(grep -E "^\s*image:" {{.COMPOSE_FILE}} | sed 's/.*image:\s*//' | sed 's/["'\'']*//g' | sort | uniq)
      fi

      printf '%s\n' "$images" | while read -r image; do
        if [ -n "$image" ]; then
          echo "  🐳 $image"
        fi
      done

  pull:
    desc: "Télécharge toutes les images du docker-compose.yml"
    silent: true
    preconditions:
    - sh: command -v docker
      msg: "Docker n'est pas installé ou accessible"
    vars:
      COMPOSE_FILE: '{{.COMPOSE_FILE | default "docker-compose.yml"}}'
    summary: |
      Utilise docker-compose pour télécharger toutes les images définies dans le fichier.

      Variables:
      - COMPOSE_FILE: Chemin vers le fichier docker-compose (défaut: docker-compose.yml)

      Exemples:
      task docker:images:pull
      task docker:images:pull COMPOSE_FILE=docker-compose.prod.yml
    cmds:
    - |
      if [ ! -f "{{.COMPOSE_FILE}}" ]; then
        echo "❌ Le fichier '{{.COMPOSE_FILE}}' n'existe pas"
        exit 1
      fi

      echo "⬇️  Téléchargement des images depuis '{{.COMPOSE_FILE}}'..."


      # Extraction yq-first (robuste aux ancres YAML/multiligne), fallback grep documenté
      if command -v yq >/dev/null 2>&1; then
        images=$(yq eval '.services.*.image' "{{.COMPOSE_FILE}}" 2>/dev/null | grep -v "null" | sort | uniq)
      else
        # Fallback sans yq : fragile sur ancres YAML/multiligne
        images=$(grep -E "^\s*image:" "{{.COMPOSE_FILE}}" | sed 's/.*image:\s*//' | sed 's/["'\'']*//g' | sort | uniq)
      fi

      # Extraction et téléchargement individuel des images pour éviter les problèmes de dépendances
      echo "🔍 Images trouvées à télécharger:"
      printf '%s\n' "$images" | while read -r image; do
        if [ -n "$image" ] && [ "$image" != "null" ]; then
          echo "  🐳 $image"
        fi
      done
      echo ""

      # Téléchargement individuel de chaque image
      # (pas de gate sur le format : digests, registries avec port et tags
      # complexes sont légitimes — `docker pull` échoue proprement sinon)
      printf '%s\n' "$images" | while read -r image; do
        if [ -n "$image" ] && [ "$image" != "null" ]; then
          image=$(echo "$image" | tr -d '\r\n' | xargs)
          echo "⬇️  Téléchargement de $image..."
          docker pull "$image" || echo "⚠️  Échec du téléchargement de $image"
        fi
      done

  extract:
    desc: "Extrait les images vers un fichier texte"
    silent: true
    preconditions:
    - sh: command -v docker
      msg: "Docker n'est pas installé ou accessible"
    vars:
      COMPOSE_FILE: '{{.COMPOSE_FILE | default "docker-compose.yml"}}'
      OUTPUT_FILE: '{{.OUTPUT_FILE | default "docker-images.txt"}}'
    summary: |
      Extrait la liste des images dans un fichier texte pour sauvegarde ou traitement.

      Variables:
      - COMPOSE_FILE: Fichier docker-compose source (défaut: docker-compose.yml)
      - OUTPUT_FILE: Fichier de sortie (défaut: docker-images.txt)

      Exemples:
      task docker:images:extract
      task docker:images:extract OUTPUT_FILE=images-prod.txt
    cmds:
    - |
      if [ ! -f "{{.COMPOSE_FILE}}" ]; then
        echo "❌ Le fichier '{{.COMPOSE_FILE}}' n'existe pas"
        exit 1
      fi

      echo "💾 Extraction des images vers '{{.OUTPUT_FILE}}'..."

      if command -v yq >/dev/null 2>&1; then
        yq eval '.services.*.image' {{.COMPOSE_FILE}} 2>/dev/null | grep -v "null" | sort | uniq > {{.OUTPUT_FILE}}
      else
        grep -E "^\s*image:" {{.COMPOSE_FILE}} | sed 's/.*image:\s*//' | sed 's/["'\'']*//g' | sort | uniq > {{.OUTPUT_FILE}}
      fi

      echo "✅ Images extraites dans '{{.OUTPUT_FILE}}'"
      echo "📊 Nombre d'images trouvées: $(wc -l < {{.OUTPUT_FILE}})"

  check:
    desc: "Vérifie la disponibilité des images localement"
    silent: true
    preconditions:
    - sh: command -v docker
      msg: "Docker n'est pas installé ou accessible"
    vars:
      COMPOSE_FILE: '{{.COMPOSE_FILE | default "docker-compose.yml"}}'
    summary: |
      Vérifie quelles images du docker-compose.yml sont présentes localement.

      Variables:
      - COMPOSE_FILE: Chemin vers le fichier docker-compose (défaut: docker-compose.yml)
    cmds:
    - |
      if [ ! -f "{{.COMPOSE_FILE}}" ]; then
        echo "❌ Le fichier '{{.COMPOSE_FILE}}' n'existe pas"
        exit 1
      fi

      echo "🔍 Vérification de la disponibilité des images..."
      echo ""

      # Extraction yq-first (robuste aux ancres YAML/multiligne), fallback grep documenté
      if command -v yq >/dev/null 2>&1; then
        images=$(yq eval '.services.*.image' {{.COMPOSE_FILE}} 2>/dev/null | grep -v "null" | sort | uniq)
      else
        # Fallback sans yq : fragile sur ancres YAML/multiligne
        images=$(grep -E "^\s*image:" {{.COMPOSE_FILE}} | sed 's/.*image:\s*//' | sed 's/["'\'']*//g' | sort | uniq)
      fi

      while IFS= read -r image; do
        if [ -n "$image" ] && [ "$image" != "null" ]; then
          if docker image inspect "$image" >/dev/null 2>&1; then
            echo "  ✅ $image (disponible localement)"
          else
            echo "  ❌ $image (non disponible localement)"
          fi
        fi
      done <<< "$images"

  updates:
    desc: "Vérifie si les images des compose sont à jour sur Docker Hub"
    silent: true
    preconditions:
    - sh: command -v curl
      msg: "curl n'est pas installé"
    - sh: command -v jq
      msg: "jq n'est pas installé"
    vars:
      COMPOSE_GLOB: '{{.COMPOSE_GLOB | default "docker-compose*.yml"}}'
    summary: |
      Interroge l'API Docker Hub pour chaque image référencée dans les fichiers
      docker-compose correspondant au motif COMPOSE_GLOB et compare le tag utilisé
      avec les tags les plus récents.

      Variables:
      - COMPOSE_GLOB: Motif des fichiers docker-compose (défaut: docker-compose*.yml)

      Exemples:
      task docker:images:updates
      task docker:images:updates COMPOSE_GLOB="docker-compose*.yml"
    cmds:
    - |
      set -e
      files=$(ls {{.COMPOSE_GLOB}} 2>/dev/null || true)
      if [ -z "$files" ]; then
        echo "❌ Aucun fichier correspondant à '$COMPOSE_GLOB'"
        exit 1
      fi
      for COMPOSE_FILE in $files; do
        echo ""
        echo "===== $COMPOSE_FILE ====="
        images=$(grep -E "^[[:space:]]*image:" "$COMPOSE_FILE" | sed 's/.*image:[[:space:]]*//' | sed 's/["'\'']*//g' | sort -u)
        echo "$images" | while IFS= read -r img; do
          [ -z "$img" ] && continue
          if echo "$img" | grep -q "@"; then img="${img%%@*}"; fi
          base="${img##*/}"
          if echo "$base" | grep -q ":"; then
            repo="${img%:*}"; tag="${img##*:}"
          else
            repo="$img"; tag="latest"
          fi
          echo ""
          echo "  image        : $img"
          echo "  repo         : $repo"
          echo "  tag actuel   : $tag"
          info=$(curl -s "https://hub.docker.com/v2/repositories/${repo}/tags/${tag}/" 2>/dev/null)
          updated=$(echo "$info" | jq -r '.last_updated // empty')
          if [ -n "$updated" ]; then
            echo "  tag existe   : oui"
            echo "  dernier push : $updated"
          else
            echo "  tag existe   : NON / erreur"
          fi
          echo "  tags recents (Docker Hub) :"
          curl -s "https://hub.docker.com/v2/repositories/${repo}/tags?page_size=8&ordering=last_updated" 2>/dev/null \
            | jq -r '.results[].name' 2>/dev/null | while IFS= read -r t; do
                marker=""
                [ "$t" = "$tag" ] && marker="  <-- ACTUEL"
                echo "     - $t$marker"
              done
        done
      done
