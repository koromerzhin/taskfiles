# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:
  init:
    desc: "Initialise Docker Swarm avec options configurables"
    silent: true
    vars:
      SWARM_DEFAULT_ADDR_POOL: '{{.SWARM_DEFAULT_ADDR_POOL | default "10.20.0.0/16"}}'
      SWARM_ADVERTISE_ADDR: '{{.SWARM_ADVERTISE_ADDR | default ""}}'
      SWARM_LISTEN_ADDR: '{{.SWARM_LISTEN_ADDR | default ""}}'
    preconditions:
    - sh: command -v docker
      msg: "Docker n'est pas installé ou accessible"
    cmds:
    - |
      echo "🐳 Initialisation de Docker Swarm..."

      # Construction par liste d'args (pas d'eval : chaque valeur reste un
      # argument unique, même avec espaces ou métacaractères)
      set -- docker swarm init

      # Ajouter default-addr-pool
      if [ -n "{{.SWARM_DEFAULT_ADDR_POOL}}" ]; then
        set -- "$@" --default-addr-pool "{{.SWARM_DEFAULT_ADDR_POOL}}"
        echo "📋 Pool d'adresses par défaut: {{.SWARM_DEFAULT_ADDR_POOL}}"
      fi

      # Ajouter advertise-addr si spécifié
      if [ -n "{{.SWARM_ADVERTISE_ADDR}}" ]; then
        set -- "$@" --advertise-addr "{{.SWARM_ADVERTISE_ADDR}}"
        echo "📡 Adresse d'annonce: {{.SWARM_ADVERTISE_ADDR}}"
      fi

      # Ajouter listen-addr si spécifié
      if [ -n "{{.SWARM_LISTEN_ADDR}}" ]; then
        set -- "$@" --listen-addr "{{.SWARM_LISTEN_ADDR}}"
        echo "👂 Adresse d'écoute: {{.SWARM_LISTEN_ADDR}}"
      fi

      echo "🚀 Exécution: $*"
      if "$@"; then
        echo "✅ Docker Swarm initialisé avec succès!"
        echo "📋 Pour voir les informations du cluster:"
        echo "   docker info"
        echo "📋 Pour ajouter des nœuds:"
        echo "   docker swarm join-token worker"
        echo "   docker swarm join-token manager"
      else
        echo "❌ Échec de l'initialisation de Docker Swarm"
        exit 1
      fi

  init-simple:
    desc: "Initialise Docker Swarm avec options par défaut"
    silent: true
    preconditions:
    - sh: command -v docker
      msg: "Docker n'est pas installé ou accessible"
    vars:
      SWARM_DEFAULT_ADDR_POOL: '{{.SWARM_DEFAULT_ADDR_POOL | default "10.20.0.0/16"}}'
      SWARM_ADVERTISE_ADDR: '{{.SWARM_ADVERTISE_ADDR | default ""}}'
    cmds:
    - |
      # --advertise-addr omis quand vide (docker refuse un flag vide) ; pas
      # d'eval, chaque valeur reste un argument unique
      set -- docker swarm init --default-addr-pool {{.SWARM_DEFAULT_ADDR_POOL}}
      if [ -n "{{.SWARM_ADVERTISE_ADDR}}" ]; then
        set -- "$@" --advertise-addr "{{.SWARM_ADVERTISE_ADDR}}"
      fi
      "$@"

  status:
    desc: "Affiche le statut du cluster Docker Swarm"
    silent: true
    preconditions:
    - sh: command -v docker
      msg: "Docker n'est pas installé ou accessible"
    cmds:
    - |
      if docker info --format '{{`{{.Swarm.LocalNodeState}}`}}' | grep -qx active; then
        echo "✅ Docker Swarm est actif"
        echo ""
        echo "📋 Informations du cluster:"
        docker node ls
        echo ""
        echo "📋 Services en cours d'exécution:"
        docker service ls
      else
        echo "❌ Docker Swarm n'est pas initialisé"
        echo "💡 Pour l'initialiser: task docker:swarm:init"
      fi

  leave:
    desc: "Quitte le cluster Docker Swarm"
    silent: true
    preconditions:
    - sh: command -v docker
      msg: "Docker n'est pas installé ou accessible"
    prompt: "Êtes-vous sûr de vouloir quitter le cluster Swarm ? (y/N)"
    cmds:
    - |
      echo "🚪 Sortie du cluster Docker Swarm..."
      if docker swarm leave --force; then
        echo "✅ Quitté le cluster Docker Swarm avec succès"
      else
        echo "❌ Échec de la sortie du cluster"
      fi

  join-tokens:
    desc: "Affiche les tokens pour rejoindre le cluster"
    silent: true
    preconditions:
    - sh: command -v docker
      msg: "Docker n'est pas installé ou accessible"
    - sh: docker info --format '{{`{{.Swarm.LocalNodeState}}`}}' | grep -qx active
      msg: "Docker Swarm n'est pas initialisé sur ce nœud"
    cmds:
    - echo "🔑 Token pour ajouter un Worker:"
    - docker swarm join-token worker
    - echo ""
    - echo "🔑 Token pour ajouter un Manager:"
    - docker swarm join-token manager
