version: '3'

tasks:
  deploy:
    desc: "Déploie une stack Docker Swarm"
    silent: true
    preconditions:
    - sh: command -v docker
      msg: "Docker n'est pas installé ou accessible"
    vars:
      STACK_NAME: '{{.STACK_NAME | default "taskfiles-stack"}}'
      COMPOSE_FILE: '{{.COMPOSE_FILE | default "docker-compose.yml"}}'
    summary: |
      Déploie une stack Docker en utilisant docker stack deploy.

      Variables:
      - STACK_NAME: Nom de la stack (défaut: taskfiles-stack)
      - COMPOSE_FILE: Fichier docker-compose à utiliser (défaut: docker-compose.yml)

      Exemples:
      task docker:stack:deploy
      task docker:stack:deploy STACK_NAME=mon-app
      task docker:stack:deploy STACK_NAME=mon-app COMPOSE_FILE=docker-stack.yml
    cmds:
    - |
      if [ ! -f "{{.COMPOSE_FILE}}" ]; then
        echo "❌ Le fichier '{{.COMPOSE_FILE}}' n'existe pas"
        echo "📁 Fichiers disponibles :"
        find . -name "docker-*.yml" -o -name "*compose*.yml" 2>/dev/null || echo "   Aucun fichier trouvé"
        exit 1
      fi

      echo "🚀 Déploiement de la stack '{{.STACK_NAME}}' avec le fichier '{{.COMPOSE_FILE}}'..."
      docker stack deploy -c {{.COMPOSE_FILE}} {{.STACK_NAME}}
      echo "✅ Stack '{{.STACK_NAME}}' déployée avec succès"

  deploy:with-build:
    desc: "Déploie une stack après avoir construit les images"
    silent: true
    preconditions:
    - sh: command -v docker
      msg: "Docker n'est pas installé ou accessible"
    vars:
      STACK_NAME: '{{.STACK_NAME | default "taskfiles-stack"}}'
      COMPOSE_FILE: '{{.COMPOSE_FILE | default "docker-compose.yml"}}'
    summary: |
      Construit les images puis déploie la stack Docker Swarm.

      Variables:
      - STACK_NAME: Nom de la stack (défaut: taskfiles-stack)
      - COMPOSE_FILE: Fichier docker-compose (défaut: docker-compose.yml)
    cmds:
    - |
      if [ ! -f "{{.COMPOSE_FILE}}" ]; then
        echo "❌ Le fichier '{{.COMPOSE_FILE}}' n'existe pas"
        exit 1
      fi

      echo "🔨 Construction des images..."
      docker compose -f {{.COMPOSE_FILE}} build

      echo "🚀 Déploiement de la stack '{{.STACK_NAME}}'..."
      docker stack deploy -c {{.COMPOSE_FILE}} {{.STACK_NAME}}
      echo "✅ Stack '{{.STACK_NAME}}' construite et déployée"

  update:
    desc: "Met à jour une stack existante"
    silent: true
    preconditions:
    - sh: command -v docker
      msg: "Docker n'est pas installé ou accessible"
    vars:
      STACK_NAME: '{{.STACK_NAME | default "taskfiles-stack"}}'
      COMPOSE_FILE: '{{.COMPOSE_FILE | default "docker-compose.yml"}}'
    summary: |
      Met à jour une stack Docker Swarm existante.
      Équivalent à docker stack deploy mais avec des messages spécifiques à la mise à jour.

      Variables:
      - STACK_NAME: Nom de la stack (défaut: taskfiles-stack)
      - COMPOSE_FILE: Fichier docker-compose (défaut: docker-compose.yml)
    cmds:
    - |
      if ! docker stack ls --format "{{`{{.Name}}`}}" | grep -q "^{{.STACK_NAME}}$"; then
        echo "❌ La stack '{{.STACK_NAME}}' n'existe pas"
        echo "📋 Stacks disponibles :"
        docker stack ls
        exit 1
      fi

      echo "🔄 Mise à jour de la stack '{{.STACK_NAME}}'..."
      docker stack deploy -c {{.COMPOSE_FILE}} {{.STACK_NAME}}
      echo "✅ Stack '{{.STACK_NAME}}' mise à jour"

  remove:
    desc: "Supprime une stack Docker Swarm"
    silent: true
    preconditions:
    - sh: command -v docker
      msg: "Docker n'est pas installé ou accessible"
    vars:
      STACK_NAME: '{{.STACK_NAME | default "taskfiles-stack"}}'
    summary: |
      Supprime complètement une stack Docker Swarm.

      Variables:
      - STACK_NAME: Nom de la stack à supprimer (défaut: taskfiles-stack)
    cmds:
    - |
      if ! docker stack ls --format "{{`{{.Name}}`}}" | grep -q "^{{.STACK_NAME}}$"; then
        echo "❌ La stack '{{.STACK_NAME}}' n'existe pas"
        echo "📋 Stacks disponibles :"
        docker stack ls
        exit 1
      fi

      echo "🗑️  Suppression de la stack '{{.STACK_NAME}}'..."
      docker stack rm {{.STACK_NAME}}
      echo "✅ Stack '{{.STACK_NAME}}' supprimée"

  list:
    desc: "Liste toutes les stacks Docker Swarm"
    silent: true
    preconditions:
    - sh: command -v docker
      msg: "Docker n'est pas installé ou accessible"
    summary: "Affiche la liste de toutes les stacks déployées"
    cmds:
    - echo "📋 Stacks Docker Swarm déployées :"
    - docker stack ls

  services:
    desc: "Liste les services d'une stack"
    silent: true
    preconditions:
    - sh: command -v docker
      msg: "Docker n'est pas installé ou accessible"
    vars:
      STACK_NAME: '{{.STACK_NAME | default "taskfiles-stack"}}'
    summary: |
      Affiche tous les services d'une stack spécifique.

      Variables:
      - STACK_NAME: Nom de la stack (défaut: taskfiles-stack)
    cmds:
    - |
      if ! docker stack ls --format "{{`{{.Name}}`}}" | grep -q "^{{.STACK_NAME}}$"; then
        echo "❌ La stack '{{.STACK_NAME}}' n'existe pas"
        echo "📋 Stacks disponibles :"
        docker stack ls
        exit 1
      fi

      echo "🔧 Services de la stack '{{.STACK_NAME}}' :"
      docker stack services {{.STACK_NAME}}

  ps:
    desc: "Affiche les tâches/conteneurs d'une stack"
    silent: true
    vars:
      STACK_NAME: '{{.STACK_NAME | default "taskfiles-stack"}}'
    preconditions:
    - sh: command -v docker
      msg: "Docker n'est pas installé ou accessible"
    summary: |
      Affiche toutes les tâches (conteneurs) d'une stack.

      Variables:
      - STACK_NAME: Nom de la stack (défaut: taskfiles-stack)
    cmds:
    - |
      if ! docker stack ls --format "{{`{{.Name}}`}}" | grep -q "^{{.STACK_NAME}}$"; then
        echo "❌ La stack '{{.STACK_NAME}}' n'existe pas"
        echo "📋 Stacks disponibles :"
        docker stack ls
        exit 1
      fi

      echo "📦 Tâches de la stack '{{.STACK_NAME}}' :"
      docker stack ps {{.STACK_NAME}}

  logs:
    desc: "Affiche les logs d'un service de la stack"
    silent: true
    vars:
      STACK_NAME: '{{.STACK_NAME | default "taskfiles-stack"}}'
      SERVICE_NAME: '{{.SERVICE_NAME | default ""}}'
    preconditions:
    - sh: command -v docker
      msg: "Docker n'est pas installé ou accessible"
    summary: |
      Affiche les logs d'un service spécifique dans une stack.

      Variables:
      - STACK_NAME: Nom de la stack (défaut: taskfiles-stack)
      - SERVICE_NAME: Nom du service (requis)

      Exemple:
      task docker:stack:logs STACK_NAME=mon-app SERVICE_NAME=web
    cmds:
    - |
      if [ -z "{{.SERVICE_NAME}}" ]; then
        echo "❌ SERVICE_NAME est requis"
        echo "🔧 Services disponibles pour la stack '{{.STACK_NAME}}' :"
        docker stack services {{.STACK_NAME}} --format "table {{.Name}}\t{{.Replicas}}\t{{.Image}}"
        exit 1
      fi

      echo "📄 Logs du service '{{.STACK_NAME}}_{{.SERVICE_NAME}}' :"
      docker service logs {{.STACK_NAME}}_{{.SERVICE_NAME}} --follow

  validate:
    desc: "Valide un fichier docker-compose pour Docker Swarm"
    silent: true
    vars:
      COMPOSE_FILE: '{{.COMPOSE_FILE | default "docker-compose.yml"}}'
    preconditions:
    - sh: command -v docker
      msg: "Docker n'est pas installé ou accessible"
    summary: |
      Valide la syntaxe d'un fichier docker-compose avant déploiement.

      Variables:
      - COMPOSE_FILE: Fichier à valider (défaut: docker-compose.yml)
    cmds:
    - |
      if [ ! -f "{{.COMPOSE_FILE}}" ]; then
        echo "❌ Le fichier '{{.COMPOSE_FILE}}' n'existe pas"
        exit 1
      fi

      echo "✅ Validation du fichier '{{.COMPOSE_FILE}}'..."
      docker compose -f {{.COMPOSE_FILE}} config
      echo "✅ Fichier valide"

  check:containers:ready:
    desc: "Vérifie que les conteneurs spécifiés sont prêts"
    silent: true
    preconditions:
    - sh: command -v docker
      msg: "Docker n'est pas installé ou accessible"
    summary: |
      Vérifie que les conteneurs ou services spécifiés sont tous actifs et en bonne santé.
      Attend et vérifie périodiquement jusqu'à ce que tous soient prêts ou timeout.

      Variables:
      - CONTAINERS: Liste des conteneurs séparés par des virgules (ex: "traefik,portainer")
      - SERVICES: Liste des services séparés par des virgules (ex: "mariadb,mercure,redis")
      - STACK_NAME: Nom de la stack (défaut: taskfiles-stack)
      - TIMEOUT: Timeout en secondes (défaut: 300)
      - CHECK_INTERVAL: Intervalle entre les vérifications en secondes (défaut: 10)

      Exemple:
      task docker:stack:check:containers:ready CONTAINERS="traefik,portainer" STACK_NAME=mon-app
      task docker:stack:check:containers:ready SERVICES="mariadb,mercure,redis" STACK_NAME=mon-app
    vars:
      TIMEOUT: '{{.TIMEOUT | default "300"}}'
      CHECK_INTERVAL: '{{.CHECK_INTERVAL | default "10"}}'
      STACK_NAME: '{{.STACK_NAME | default "taskfiles-stack"}}'
      CONTAINERS: '{{.CONTAINERS | default ""}}'
      SERVICES: '{{.SERVICES | default ""}}'
    cmds:
    - |
      if [ -z "{{.CONTAINERS}}" ] && [ -z "{{.SERVICES}}" ]; then
        echo "❌ CONTAINERS ou SERVICES est requis (ex: 'traefik,portainer' ou 'mariadb,mercure,redis')"
        exit 1
      fi

      start_time=$(date +%s)
      timeout_time=$((start_time + {{.TIMEOUT}}))
      check_count=0

      if [ -n "{{.CONTAINERS}}" ]; then
        echo "🔍 Vérification de l'état des conteneurs demandés : {{.CONTAINERS}}"
        containers_list="{{.CONTAINERS}}"
        containers_clean=$(echo "$containers_list" | tr ',' ' ')
      fi

      if [ -n "{{.SERVICES}}" ]; then
        echo "🔍 Vérification de l'état des services : {{.SERVICES}}"
        services_list="{{.SERVICES}}"
        services_clean=$(echo "$services_list" | tr ',' ' ')
      fi

      echo "🕐 Timeout: {{.TIMEOUT}}s, Intervalle de vérification: {{.CHECK_INTERVAL}}s"
      echo ""

      while true; do
        current_time=$(date +%s)
        check_count=$((check_count + 1))

        # Timeout
        if [ $current_time -gt $timeout_time ]; then
          echo ""
          echo "❌ Timeout atteint ({{.TIMEOUT}}s). Tous les éléments ne sont pas encore prêts."
          if [ -n "{{.CONTAINERS}}" ]; then
            echo "📋 État final des conteneurs :"
            docker ps --filter "name={{.STACK_NAME}}" --format "table {{.Names}}\t{{.Status}}"
          fi
          if [ -n "{{.SERVICES}}" ]; then
            echo "📋 État final des services :"
            for service in $services_clean; do
              service=$(echo "$service" | xargs)
              service_full_name="{{.STACK_NAME}}_${service}"
              replicas=$(docker service ls --filter "name=$service_full_name" --format "{{.Replicas}}" 2>/dev/null || echo "non trouvé")
              echo "   $service: $replicas"
            done
          fi
          exit 1
        fi

        all_ready=true
        ready_containers=""
        missing_containers=""
        ready_services=""
        pending_services=""

        # Vérification des conteneurs demandés uniquement
        if [ -n "{{.CONTAINERS}}" ]; then
          for container in $containers_clean; do
            container=$(echo "$container" | xargs)
            # Vérifie uniquement le conteneur explicitement demandé
            if docker ps --filter "name={{.STACK_NAME}}_${container}" --format "{{.Names}}" | grep -wq "{{.STACK_NAME}}_${container}"; then
              ready_containers="$ready_containers $container"
            else
              missing_containers="$missing_containers $container"
              all_ready=false
            fi
          done
        fi

        # Vérification des services
        if [ -n "{{.SERVICES}}" ]; then
          for service in $services_clean; do
            service=$(echo "$service" | xargs)
            service_full_name="{{.STACK_NAME}}_${service}"
            if docker service ls --filter "name=$service_full_name" --format "{{.Replicas}}" | grep -q "1/1\|[2-9]/[2-9]"; then
              ready_services="$ready_services $service"
            else
              pending_services="$pending_services $service"
              all_ready=false
            fi
          done
        fi

        # Affichage de l'état
        elapsed=$((current_time - start_time))
        echo "⏳ Vérification #$check_count (${elapsed}s/{{.TIMEOUT}}s)"
        if [ -n "$ready_containers" ]; then
          echo "  ✅ Conteneurs prêts     :$ready_containers"
        fi
        if [ -n "$missing_containers" ]; then
          echo "  ⏳ Conteneurs en attente :$missing_containers"
        fi
        if [ -n "$ready_services" ]; then
          echo "  ✅ Services actifs      :$ready_services"
        fi
        if [ -n "$pending_services" ]; then
          echo "  ⏳ Services en attente  :$pending_services"
        fi

        # Succès si tout est prêt
        if [ "$all_ready" = true ]; then
          echo ""
          echo "🎉 Succès ! Tous les éléments sont actifs !"
          echo "⏱️  Temps total d'attente : ${elapsed}s"
          if [ -n "{{.CONTAINERS}}" ]; then
            echo "📋 Conteneurs actifs :"
            for container in $containers_clean; do
              container=$(echo "$container" | xargs)
              status=$(docker ps --filter "name={{.STACK_NAME}}_${container}" --format "{{.Status}}")
              echo "  ✅ ${container} - $status"
            done
          fi
          break
        fi

        echo ""
        sleep {{.CHECK_INTERVAL}}
      done

  exec:
    desc: "Exécute une commande dans un conteneur d'une stack"
    silent: true
    preconditions:
    - sh: command -v docker
      msg: "Docker n'est pas installé ou accessible"
    vars:
      STACK_NAME: '{{.STACK_NAME | default "taskfiles-stack"}}'
      SERVICE_NAME: '{{.SERVICE_NAME | default ""}}'
      COMMAND: '{{.COMMAND | default "sh"}}'
      TASK_FILTER: '{{.TASK_FILTER | default "running"}}'
      INTERACTIVE: '{{.INTERACTIVE | default "true"}}'
    summary: |
      Exécute une commande dans un conteneur appartenant à une stack Docker Swarm.

      Variables requises:
      - SERVICE_NAME: Nom du service dans la stack (ex: "web", "api", "database")

      Variables optionnelles:
      - STACK_NAME: Nom de la stack (défaut: taskfiles-stack)
      - COMMAND: Commande à exécuter (défaut: sh)
      - TASK_FILTER: Filtre pour les tâches (défaut: running)
      - INTERACTIVE: Mode interactif (défaut: true)

      Exemples:
      task docker:stack:exec SERVICE_NAME=web
      task docker:stack:exec SERVICE_NAME=web COMMAND="ls -la"
      task docker:stack:exec SERVICE_NAME=api COMMAND="/app/scripts/migrate.sh"
      task docker:stack:exec SERVICE_NAME=database COMMAND="mysql -u root -p" INTERACTIVE=true
      task docker:stack:exec STACK_NAME=production SERVICE_NAME=worker COMMAND="python manage.py migrate"
    cmds:
    - |
      if [ -z "{{.SERVICE_NAME}}" ]; then
        echo "❌ SERVICE_NAME est requis"
        echo ""
        echo "🔧 Services disponibles dans la stack '{{.STACK_NAME}}' :"
        if docker stack ls --format "{{.Name}}" | grep -q "^{{.STACK_NAME}}$"; then
          docker stack services {{.STACK_NAME}} --format "table {{.Name}}\t{{.Replicas}}\t{{.Image}}"
        else
          echo "❌ La stack '{{.STACK_NAME}}' n'existe pas"
          echo "📋 Stacks disponibles :"
          docker stack ls --format "{{.Name}}"
        fi
        exit 1
      fi

      # Vérifier que la stack existe
      echo "🔍 Vérification de l'existence de la stack '{{.STACK_NAME}}'..."
      if ! docker stack ls | awk 'NR>1 {print $1}' | grep -q "^{{.STACK_NAME}}$"; then
        echo "❌ La stack '{{.STACK_NAME}}' n'existe pas"
        echo "📋 Stacks disponibles :"
        docker stack ls | awk 'NR>1 {print $1}'
        exit 1
      fi
      echo "✅ Stack '{{.STACK_NAME}}' trouvée"

      service_full_name="{{.STACK_NAME}}_{{.SERVICE_NAME}}"

      # Vérifier que le service existe
      echo "🔍 Vérification de l'existence du service '$service_full_name'..."
      if ! docker service ls | awk 'NR>1 {print $2}' | grep -q "^$service_full_name$"; then
        echo "❌ Le service '$service_full_name' n'existe pas"
        echo ""
        echo "🔧 Services disponibles dans la stack '{{.STACK_NAME}}' :"
        docker stack services {{.STACK_NAME}} | awk 'NR>1 {print $2}'
        exit 1
      fi
      echo "✅ Service '$service_full_name' trouvé"

      # Trouver le conteneur actif pour ce service
      echo "🔍 Recherche d'un conteneur actif pour le service '$service_full_name'..."

      container_id=$(docker ps | grep "$service_full_name" | awk '{print $1}' | head -n 1)

      if [ -z "$container_id" ]; then
        echo "❌ Aucun conteneur actif trouvé pour le service '$service_full_name'"
        echo ""
        echo "📋 État des tâches pour ce service :"
        docker service ps $service_full_name
        exit 1
      fi

      container_name=$(docker ps | grep "$container_id" | awk '{print $NF}')
      echo "✅ Conteneur trouvé : $container_name ($container_id)"
      echo "🚀 Exécution de la commande : {{.COMMAND}}"
      echo ""

      # Préparer les options Docker exec
      docker_options=""
      # Vérifier si on est dans un environnement CI/CD où TTY n'est pas disponible
      if [ "${DOCKER_INTERACTIVE:-true}" = "false" ] || [ "${CI:-false}" = "true" ] || [ "${GITHUB_ACTIONS:-false}" = "true" ]; then
        # En CI/CD, ne pas utiliser le mode interactif
        docker_options=""
      elif [ ! -t 0 ] || [ ! -t 1 ]; then
        # Sans terminal réel (ex: npm/release-it), éviter -it
        docker_options=""
      elif [ "{{.INTERACTIVE}}" = "true" ]; then
        docker_options="-it"
      fi

      # Exécuter la commande
      docker exec $docker_options $container_id {{.COMMAND}}

  shell:
    desc: "Accède au shell (bash ou sh) d'un conteneur dans une stack"
    silent: true
    preconditions:
    - sh: command -v docker
      msg: "Docker n'est pas installé ou accessible"
    vars:
      STACK_NAME: '{{.STACK_NAME | default "taskfiles-stack"}}'
      SERVICE_NAME: '{{.SERVICE_NAME | default ""}}'
      SHELL_TYPE: '{{.SHELL_TYPE | default "auto"}}'
      EXEC_USER: '{{.EXEC_USER | default ""}}'
    summary: |
      Accède au shell interactif (bash ou sh) d'un conteneur appartenant à une stack Docker Swarm.
      Détecte automatiquement le shell disponible (bash prioritaire, sinon sh).

      Variables requises:
      - SERVICE_NAME: Nom du service dans la stack (ex: "web", "api", "database")

      Variables optionnelles:
      - STACK_NAME: Nom de la stack (défaut: taskfiles-stack)
      - SHELL_TYPE: Type de shell à utiliser - "bash", "sh", "auto" (défaut: auto)
      - EXEC_USER: Utilisateur pour l'exécution (défaut: utilisateur par défaut du conteneur)

      Exemples:
      task docker:stack:shell SERVICE_NAME=web
      task docker:stack:shell SERVICE_NAME=api SHELL_TYPE=bash
      task docker:stack:shell SERVICE_NAME=database EXEC_USER=root
      task docker:stack:shell STACK_NAME=production SERVICE_NAME=worker SHELL_TYPE=sh
    cmds:
    - |
      if [ -z "{{.SERVICE_NAME}}" ]; then
        echo "❌ SERVICE_NAME est requis"
        echo ""
        echo "🔧 Services disponibles dans la stack '{{.STACK_NAME}}' :"
        if docker stack ls --format "{{.Name}}" | grep -q "^{{.STACK_NAME}}$"; then
          docker stack services {{.STACK_NAME}} --format "table {{.Name}}\t{{.Replicas}}\t{{.Image}}"
        else
          echo "❌ La stack '{{.STACK_NAME}}' n'existe pas"
          echo "📋 Stacks disponibles :"
          docker stack ls --format "{{.Name}}"
        fi
        exit 1
      fi

      # Vérifier que la stack existe
      echo "🔍 Vérification de l'existence de la stack '{{.STACK_NAME}}'..."
      if ! docker stack ls | awk 'NR>1 {print $1}' | grep -q "^{{.STACK_NAME}}$"; then
        echo "❌ La stack '{{.STACK_NAME}}' n'existe pas"
        echo "📋 Stacks disponibles :"
        docker stack ls | awk 'NR>1 {print $1}'
        exit 1
      fi
      echo "✅ Stack '{{.STACK_NAME}}' trouvée"

      service_full_name="{{.STACK_NAME}}_{{.SERVICE_NAME}}"

      # Vérifier que le service existe
      echo "🔍 Vérification de l'existence du service '$service_full_name'..."
      if ! docker service ls | awk 'NR>1 {print $2}' | grep -q "^$service_full_name$"; then
        echo "❌ Le service '$service_full_name' n'existe pas"
        echo ""
        echo "🔧 Services disponibles dans la stack '{{.STACK_NAME}}' :"
        docker stack services {{.STACK_NAME}} | awk 'NR>1 {print $2}'
        exit 1
      fi
      echo "✅ Service '$service_full_name' trouvé"

      # Trouver le conteneur actif pour ce service
      echo "🔍 Recherche d'un conteneur actif pour le service '$service_full_name'..."

      container_id=$(docker ps | grep "$service_full_name" | awk '{print $1}' | head -n 1)

      if [ -z "$container_id" ]; then
        echo "❌ Aucun conteneur actif trouvé pour le service '$service_full_name'"
        echo ""
        echo "📋 État des tâches pour ce service :"
        docker service ps $service_full_name
        exit 1
      fi

      container_name=$(docker ps | grep "$container_id" | awk '{print $NF}')
      echo "✅ Conteneur trouvé : $container_name ($container_id)"

      # Déterminer le shell à utiliser
      shell_command=""
      shell_type="{{.SHELL_TYPE}}"

      if [ "$shell_type" = "auto" ]; then
        echo "🔍 Détection automatique du shell disponible..."
        
        # Tester bash en premier
        if docker exec $container_id which bash >/dev/null 2>&1; then
          shell_command="bash"
          echo "✅ Bash détecté et disponible"
        elif docker exec $container_id which sh >/dev/null 2>&1; then
          shell_command="sh"
          echo "✅ Shell sh détecté et disponible"
        else
          echo "❌ Aucun shell compatible trouvé (bash/sh)"
          echo "💡 Shells disponibles dans le conteneur :"
          docker exec $container_id ls -la /bin/*sh 2>/dev/null || echo "   Aucun shell trouvé dans /bin/"
          exit 1
        fi
      else
        shell_command="$shell_type"
        echo "🔧 Shell spécifié : $shell_command"
        
        # Vérifier que le shell spécifié existe
        if ! docker exec $container_id which $shell_command >/dev/null 2>&1; then
          echo "❌ Shell '$shell_command' non disponible dans le conteneur"
          echo "💡 Shells disponibles :"
          docker exec $container_id ls -la /bin/*sh 2>/dev/null || echo "   Aucun shell trouvé dans /bin/"
          exit 1
        fi
      fi

      # Préparer les options pour docker exec
      docker_options=""
      # Vérifier si on est dans un environnement CI/CD où TTY n'est pas disponible
      if [ "${DOCKER_INTERACTIVE:-true}" = "false" ] || [ "${CI:-false}" = "true" ] || [ "${GITHUB_ACTIONS:-false}" = "true" ]; then
        # En CI/CD, ne pas utiliser le mode interactif
        docker_options=""
        echo "⚠️  Mode non-interactif détecté (CI/CD)"
      elif [ ! -t 0 ] || [ ! -t 1 ]; then
        # Sans terminal réel (ex: lancement via script), éviter -it
        docker_options=""
        echo "⚠️  Aucun TTY détecté, bascule en mode non-interactif"
      else
        # En environnement normal, utiliser le mode interactif pour shell
        docker_options="-it"
      fi

      # Ajouter l'utilisateur si spécifié
      if [ -n "{{.EXEC_USER}}" ]; then
        docker_options="$docker_options --user {{.EXEC_USER}}"
        echo "👤 Utilisateur : {{.EXEC_USER}}"
      fi

      echo ""
      echo "🐚 Ouverture du shell interactif..."
      echo "   🐳 Conteneur : $container_name ($container_id)"
      echo "   🐚 Shell : $shell_command"
      echo "   ⌨️  Mode : Interactif"
      echo ""
      echo "💡 Tapez 'exit' pour quitter le shell"
      echo "─────────────────────────────────────────────"
      echo ""

      # Lancer le shell interactif
      docker exec $docker_options $container_id $shell_command

  exec:script:
    desc: "Exécute un script dans un conteneur d'une stack"
    silent: true
    preconditions:
    - sh: command -v docker
      msg: "Docker n'est pas installé ou accessible"
    vars:
      STACK_NAME: '{{.STACK_NAME | default "taskfiles-stack"}}'
      SERVICE_NAME: '{{.SERVICE_NAME | default ""}}'
      SCRIPT_PATH: '{{.SCRIPT_PATH | default ""}}'
      SCRIPT_ARGS: '{{.SCRIPT_ARGS | default ""}}'
      TASK_FILTER: '{{.TASK_FILTER | default "running"}}'
      WORKING_DIR: '{{.WORKING_DIR | default ""}}'
    summary: |
      Exécute un script spécifique dans un conteneur appartenant à une stack Docker Swarm.

      Variables requises:
      - SERVICE_NAME: Nom du service dans la stack (ex: "web", "api", "database")  
      - SCRIPT_PATH: Chemin du script à exécuter dans le conteneur

      Variables optionnelles:
      - STACK_NAME: Nom de la stack (défaut: taskfiles-stack)
      - SCRIPT_ARGS: Arguments à passer au script (défaut: "")
      - TASK_FILTER: Filtre pour les tâches (défaut: running)
      - WORKING_DIR: Répertoire de travail dans le conteneur (défaut: répertoire courant du conteneur)

      Exemples:
      task docker:stack:exec:script SERVICE_NAME=web SCRIPT_PATH="/app/scripts/deploy.sh"
      task docker:stack:exec:script SERVICE_NAME=api SCRIPT_PATH="/app/migrate.py" SCRIPT_ARGS="--force"
      task docker:stack:exec:script SERVICE_NAME=worker SCRIPT_PATH="/scripts/backup.sh" WORKING_DIR="/data"
      task docker:stack:exec:script STACK_NAME=production SERVICE_NAME=app SCRIPT_PATH="/opt/scripts/maintenance.sh" SCRIPT_ARGS="--mode full"
    cmds:
    - |
      if [ -z "{{.SERVICE_NAME}}" ]; then
        echo "❌ SERVICE_NAME est requis"
        echo ""
        echo "🔧 Services disponibles dans la stack '{{.STACK_NAME}}' :"
        if docker stack ls | awk 'NR>1 {print $1}' | grep -q "^{{.STACK_NAME}}$"; then
          docker stack services {{.STACK_NAME}} --format "table {{.Name}}\t{{.Replicas}}\t{{.Image}}"
        else
          echo "❌ La stack '{{.STACK_NAME}}' n'existe pas"
        fi
        exit 1
      fi

      if [ -z "{{.SCRIPT_PATH}}" ]; then
        echo "❌ SCRIPT_PATH est requis"
        echo "💡 Exemple: SCRIPT_PATH=/app/scripts/deploy.sh"
        exit 1
      fi

      # Vérifier que la stack existe
      if ! docker stack ls | awk 'NR>1 {print $1}' | grep -q "^{{.STACK_NAME}}$"; then
        echo "❌ La stack '{{.STACK_NAME}}' n'existe pas"
        echo "📋 Stacks disponibles :"
        docker stack ls | awk 'NR>1 {print $1}'
        exit 1
      fi

      service_full_name="{{.STACK_NAME}}_{{.SERVICE_NAME}}"

      # Vérifier que le service existe
      if ! docker service ls --filter "name=$service_full_name" --format "{{.Name}}" | grep -q "^$service_full_name$"; then
        echo "❌ Le service '$service_full_name' n'existe pas"
        echo ""
        echo "🔧 Services disponibles dans la stack '{{.STACK_NAME}}' :"
        docker stack services {{.STACK_NAME}} --format "table {{.Name}}\t{{.Replicas}}\t{{.Image}}"
        exit 1
      fi

      # Trouver le conteneur actif pour ce service
      echo "🔍 Recherche d'un conteneur actif pour le service '$service_full_name'..."

      container_id=$(docker ps --filter "label=com.docker.swarm.service.name=$service_full_name" --filter "status={{.TASK_FILTER}}" --format "{{.ID}}" | head -n 1)

      if [ -z "$container_id" ]; then
        echo "❌ Aucun conteneur {{.TASK_FILTER}} trouvé pour le service '$service_full_name'"
        echo ""
        echo "📋 État des tâches pour ce service :"
        docker service ps $service_full_name --format "table {{.Name}}\t{{.Node}}\t{{.DesiredState}}\t{{.CurrentState}}"
        exit 1
      fi

      container_name=$(docker ps --filter "id=$container_id" --format "{{.Names}}")
      echo "✅ Conteneur trouvé : $container_name ($container_id)"

      # Vérifier que le script existe dans le conteneur
      echo "🔍 Vérification de l'existence du script '{{.SCRIPT_PATH}}'..."
      if ! docker exec $container_id test -f "{{.SCRIPT_PATH}}"; then
        echo "❌ Le script '{{.SCRIPT_PATH}}' n'existe pas dans le conteneur"
        echo ""
        echo "💡 Contenu du répertoire parent :"
        script_dir=$(dirname "{{.SCRIPT_PATH}}")
        docker exec $container_id ls -la "$script_dir" 2>/dev/null || echo "   Répertoire '$script_dir' non accessible"
        exit 1
      fi

      # Vérifier que le script est exécutable
      if ! docker exec $container_id test -x "{{.SCRIPT_PATH}}"; then
        echo "⚠️  Le script '{{.SCRIPT_PATH}}' n'est pas exécutable"
        echo "🔧 Tentative de correction des permissions..."
        docker exec $container_id chmod +x "{{.SCRIPT_PATH}}"
      fi

      # Construire la commande
      command="{{.SCRIPT_PATH}}"
      if [ -n "{{.SCRIPT_ARGS}}" ]; then
        command="$command {{.SCRIPT_ARGS}}"
      fi

      # Ajouter le changement de répertoire si spécifié
      if [ -n "{{.WORKING_DIR}}" ]; then
        command="cd {{.WORKING_DIR}} && $command"
      fi

      echo "🚀 Exécution du script :"
      echo "   📄 Script : {{.SCRIPT_PATH}}"
      if [ -n "{{.SCRIPT_ARGS}}" ]; then
        echo "   📋 Arguments : {{.SCRIPT_ARGS}}"
      fi
      if [ -n "{{.WORKING_DIR}}" ]; then
        echo "   📁 Répertoire : {{.WORKING_DIR}}"
      fi
      echo "   🐳 Conteneur : $container_name"
      echo ""

      # Exécuter le script
      docker exec $container_id sh -c "$command"
      exit_code=$?

      echo ""
      if [ $exit_code -eq 0 ]; then
        echo "✅ Script exécuté avec succès"
      else
        echo "❌ Le script a échoué avec le code de sortie $exit_code"
        exit $exit_code
      fi
