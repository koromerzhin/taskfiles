version: 3

tasks:
  updateconfig:
    desc: Met à jour les fichiers de configuration Apache avec la variable d'environnement APACHE_DOCUMENT_ROOT.
    vars:
      APACHE_DOCUMENT_ROOT: '{{.APACHE_DOCUMENT_ROOT | default "/var/www/public"}}'
      DEFAULT_FILE: '{{.DEFAULT_FILE | default "./conf/apache2/000-default.conf"}}'
      APACHE_CONF_FILE: '{{.APACHE_CONF_FILE | default "./conf/apache2/apache2.conf"}}'
      SERVERNAME: '{{.SERVERNAME | default "localhost"}}'
    silent: true
    cmds:

    - |
      set -e
      # Mémoriser si apache2.conf contient déjà une directive ServerName (commentée ou non)
      # AVANT la transformation, sinon la branche d'ajout ne serait jamais atteinte.
      if grep -qE '^\s*#?\s*ServerName\s+' "{{.APACHE_CONF_FILE}}"; then
        HAS_SERVERNAME=1
      else
        HAS_SERVERNAME=0
      fi

      for file in "{{.DEFAULT_FILE}}" "{{.APACHE_CONF_FILE}}"; do
        if [ ! -f "$file" ]; then
          echo "Fichier introuvable: $file" >&2
          exit 1
        fi
        sed -ri \
          -e 's|\$\{APACHE_DOCUMENT_ROOT\}|{{.APACHE_DOCUMENT_ROOT}}|g' \
          -e 's|^\s*DocumentRoot\s+.*$|DocumentRoot {{.APACHE_DOCUMENT_ROOT}}|g' \
          -e 's|^\s*#?\s*ServerName\s+.*$|ServerName {{.SERVERNAME}}|g' \
          "$file"
      done

      # Ajouter ServerName dans apache2.conf uniquement s'il n'existait pas déjà
      if [ "$HAS_SERVERNAME" = "0" ]; then
        sed -i '/^# Global configuration/a\
        #\
        # ServerName: Set the servers fully qualified domain name globally\
        # This suppresses the warning about not being able to reliably determine\
        # the servers fully qualified domain name\
        #\
        ServerName {{.SERVERNAME}}' "{{.APACHE_CONF_FILE}}"
      fi
