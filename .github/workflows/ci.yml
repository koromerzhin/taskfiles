name: CI Pipeline
on: 
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      DOCKER_INTERACTIVE: false
    steps:
      # === SETUP PHASE ===
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Docker Compose
        uses: docker/setup-compose-action@v2
      
      - name: Setup Task
        uses: go-task/setup-task@v2
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      # Note : pas de actions/cache sur node_modules — setup-node met déjà en
      # cache le cache npm, et `npm ci` (install propre, échoue si le lock
      # est désynchronisé) rend tout node_modules restauré obsolète/dangereux.
      - name: Install dependencies
        run: npm ci
      
      - name: Setup environment files
        run: |
          cp .env.example .env
      
      - name: lint all
        run: task lint:all