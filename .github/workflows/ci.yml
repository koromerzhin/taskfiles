name: CI Pipeline
on: 
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      DOCKER_INTERACTIVE: false
    steps:
      # === SETUP PHASE ===
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Docker Compose
        uses: docker/setup-compose-action@v2
      
      - name: Setup Task
        uses: go-task/setup-task@v2
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      # Note : pas de actions/cache sur node_modules — setup-node met déjà en
      # cache le cache npm, et `npm ci` (install propre, échoue si le lock
      # est désynchronisé) rend tout node_modules restauré obsolète/dangereux.
      - name: Install dependencies
        run: npm ci
      
      - name: Setup environment files
        run: |
          cp .env.example .env
      
      - name: lint all
        run: task lint:all

  shellcheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Setup Python YAML lib
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml

      # task lint:shell auto-installe shellcheck épinglé (v0.11.0) si absent,
      # extrait les cmds: des Taskfiles (templates masqués) et échoue sur
      # tout avertissement réel. Bloquant dès le jour 1 (état vert vérifié).
      - name: shellcheck embedded scripts
        run: task lint:shell