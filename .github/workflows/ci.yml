name: CI Pipeline
on: 
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      DOCKER_INTERACTIVE: false
    steps:
      # === SETUP PHASE ===
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Docker Compose
        uses: docker/setup-compose-action@v2
      
      - name: Setup Task
        uses: go-task/setup-task@v2
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      # Politique de versions : `stable` volontaire ici — seul le binaire qui
      # compte (`actionlint`, installé par `task lint:action`) est épinglé
      # (v1.7.12, voir lint/Taskfile.yml). Même logique côté npm : plages
      # assumées (package.json), `npm ci` + lock pour la reproductibilité.
      - name: Setup Go (requis par lint:action)
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Setup Python YAML lib (requis par lint:shell)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml

      # Note : pas de actions/cache sur node_modules — setup-node met déjà en
      # cache le cache npm, et `npm ci` (install propre, échoue si le lock
      # est désynchronisé) rend tout node_modules restauré obsolète/dangereux.
      - name: Install dependencies
        run: npm ci
      
      - name: Setup environment files
        run: |
          cp .env.example .env
      
      - name: lint all
        run: task lint:all

      # Le `.env` ne sert qu'aux tâches (dotenv racine) : nettoyé en fin de
      # job pour ne pas laisser de pattern polluant (anodin sur runner
      # éphémère, utile si copié dans un projet réel).
      - name: Cleanup environment files
        if: always()
        run: rm -f .env

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Setup bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats

      # Suite hermétique (test/) : env, backup create/list/restore, clean:logs,
      # checksum SHA + garde mismatch — sans réseau ni Docker.
      - name: run bats suite
        run: task test

  shellcheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Setup Python YAML lib
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml

      # task lint:shell auto-installe shellcheck épinglé (v0.11.0) si absent,
      # extrait les cmds: des Taskfiles (templates masqués) et échoue sur
      # tout avertissement réel. Bloquant dès le jour 1 (état vert vérifié).
      - name: shellcheck embedded scripts
        run: task lint:shell