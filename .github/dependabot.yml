version: 2
updates:
  # 1️⃣ Dépendances Node.js (npm)
  - package-ecosystem: "npm"
    directory: "/" # Racine du projet
    schedule:
      interval: "weekly"  # Peut être daily / weekly / monthly
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 10
  # Note : écosystèmes `docker` et `composer` volontairement retirés —
  # aucun docker-compose.yml ni composer.json à la racine, ils ne généraient que du bruit.
  # Les réactiver quand les manifestes correspondants seront ajoutés.
