# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  PHP_TOOLS_NAMES: |
    phploc.phar
    php-cs-fixer.phar
    phpmd.phar
    phpcbf.phar
    phpcs.phar
    phpstan.phar
    phpDocumentor.phar
    behat.phar
  PHP_TOOLS_URLS: |
    https://phar.phpunit.de/phploc-{{.PHPLOC_VERSION}}.phar
    https://github.com/FriendsOfPHP/PHP-CS-Fixer/releases/download/v{{.PHP_CS_FIXER_VERSION}}/php-cs-fixer.phar
    https://github.com/phpmd/phpmd/releases/download/{{.PHPMD_VERSION}}/phpmd.phar
    https://github.com/squizlabs/PHP_CodeSniffer/releases/download/{{.PHP_CODESNIFFER_VERSION}}/phpcbf.phar
    https://github.com/squizlabs/PHP_CodeSniffer/releases/download/{{.PHP_CODESNIFFER_VERSION}}/phpcs.phar
    https://github.com/phpstan/phpstan/releases/download/{{.PHPSTAN_VERSION}}/phpstan.phar
    https://github.com/phpDocumentor/phpDocumentor/releases/download/v{{.PHPDOCUMENTOR_VERSION}}/phpDocumentor.phar
    https://github.com/Behat/Behat/releases/download/v{{.BEHAT_VERSION}}/behat.phar
  # Versions épinglées — surchargeables sans éditer le code (ex. PHPSTAN_VERSION=2.3.1)
  PHPLOC_VERSION: '{{.PHPLOC_VERSION | default "7.0.2"}}'
  PHP_CS_FIXER_VERSION: '{{.PHP_CS_FIXER_VERSION | default "3.95.27"}}'
  PHPMD_VERSION: '{{.PHPMD_VERSION | default "2.15.0"}}'
  PHP_CODESNIFFER_VERSION: '{{.PHP_CODESNIFFER_VERSION | default "3.7.2"}}'
  PHPSTAN_VERSION: '{{.PHPSTAN_VERSION | default "2.3.1"}}'
  PHPDOCUMENTOR_VERSION: '{{.PHPDOCUMENTOR_VERSION | default "3.5.3"}}'
  BEHAT_VERSION: '{{.BEHAT_VERSION | default "3.14.0"}}'
  # Sommes SHA256 attendues — épinglées aux versions ci-dessus (téléchargées le
  # 2026-10-13 depuis les URLs officielles en HTTPS, sommes constatées via
  # `task download:php:checksum`). Surchargeables (ex. PHPSTAN_SHA256=abc123...)
  # lors d'une montée de version ; vide = vérification ignorée.
  PHPLOC_SHA256: '{{.PHPLOC_SHA256 | default "3d59778ec86faf25fd00e3a329b2f9ad4a3c751ca91601ea7dab70f887b0bf46"}}'
  PHP_CS_FIXER_SHA256: '{{.PHP_CS_FIXER_SHA256 | default "47231757eefdd08778e2bd047d98a63dfaad881006c8c1d1bc870d63be7f6a9b"}}'
  PHPMD_SHA256: '{{.PHPMD_SHA256 | default "6a28ef55de0c753b070d1d1580bb08a0d146016f89f0eddcef60ac4fc1083544"}}'
  PHP_CODESNIFFER_PHPCBF_SHA256: '{{.PHP_CODESNIFFER_PHPCBF_SHA256 | default "4eca732a997df08a4c97e43266eb8122f916d39bb002a000600fdd5393f4efe1"}}'
  PHP_CODESNIFFER_PHPCS_SHA256: '{{.PHP_CODESNIFFER_PHPCS_SHA256 | default "204214c1ea5ba814fb0b2608c19cca2c10bf5ffcc9f0e3d4c34aadc0179517b7"}}'
  PHPSTAN_SHA256: '{{.PHPSTAN_SHA256 | default "85157dba3d95d77ca603d2b7303aa78a538f9e3b56ccad07dd794c53aa96d1ae"}}'
  PHPDOCUMENTOR_SHA256: '{{.PHPDOCUMENTOR_SHA256 | default "9760ac280a10041928a8743354f68692c22f14cd5d05135dfc15e11d3b3c25ea"}}'
  BEHAT_SHA256: '{{.BEHAT_SHA256 | default "c2f98e0041c65f7dafee42f3f7ecd3da63e2cc86ce1a0b4c48e5f431c5859a18"}}'

tasks:
  tools:
    desc: "Télécharge les outils PHP dans un dossier spécifique"
    silent: true
    summary: |
      Télécharge une collection d'outils PHP populaires dans un dossier.

      Variables:
      - TOOLS_DIR: Dossier de destination (défaut: ./tools/php)
      - FORCE: Force le téléchargement même si le fichier existe (défaut: false)
      - Versions épinglées (surchargeables) : PHPLOC_VERSION, PHP_CS_FIXER_VERSION,
        PHPMD_VERSION, PHP_CODESNIFFER_VERSION, PHPSTAN_VERSION,
        PHPDOCUMENTOR_VERSION, BEHAT_VERSION
      - Sommes SHA256 (épinglées aux versions ci-dessus, vérifiées avant chmod +x ;
        surchargeables lors d'une montée de version, vide = vérification ignorée) :
        PHPLOC_SHA256, PHP_CS_FIXER_SHA256, PHPMD_SHA256,
        PHP_CODESNIFFER_PHPCBF_SHA256, PHP_CODESNIFFER_PHPCS_SHA256,
        PHPSTAN_SHA256, PHPDOCUMENTOR_SHA256, BEHAT_SHA256
        (recalculables via `task download:php:checksum`)

      Outils téléchargés:
      - phploc.phar (PHP Lines of Code)
      - php-cs-fixer.phar (PHP CS Fixer)
      - phpmd.phar (PHP Mess Detector)
      - phpcbf.phar (PHP Code Beautifier)
      - phpcs.phar (PHP Code Sniffer)
      - phpstan.phar (PHPStan)
      - phpDocumentor.phar (phpDocumentor)
      - behat.phar (Behat)

      Exemples:
      task download:php:tools
      task download:php:tools TOOLS_DIR=./bin
      task download:php:tools FORCE=true
      task download:php:tools PHPSTAN_VERSION=2.3.1
    vars:
      TOOLS_DIR: '{{.TOOLS_DIR | default "./tools/php"}}'
      FORCE: '{{.FORCE | default "false"}}'
    cmds:
    - |
      # Racine du projet : git toplevel si dispo, sinon TASKFILE_DIR/../.. (ce fichier vit à download/php/)
      if git rev-parse --show-toplevel >/dev/null 2>&1; then
        project_root=$(git rev-parse --show-toplevel)
      else
        project_root="$(cd "{{.TASKFILE_DIR}}/../.." && pwd)"
      fi

      # Déterminer le chemin absolu du dossier de destination
      if [[ "{{.TOOLS_DIR}}" == /* ]]; then
        # Chemin absolu fourni
        tools_dir="{{.TOOLS_DIR}}"
      else
        # Chemin relatif fourni - le baser sur la racine du projet
        tools_dir="$project_root/{{.TOOLS_DIR}}"
      fi

      echo "📦 Téléchargement des outils PHP dans '$tools_dir'..."
      echo ""

      # Création du dossier de destination
      mkdir -p "$tools_dir"

      # Récupération des variables et conversion en tableaux
      tool_names_raw="{{.PHP_TOOLS_NAMES}}"
      tool_urls_raw="{{.PHP_TOOLS_URLS}}"

      # Conversion en tableaux (compatible bash/zsh)
      tool_names=()
      tool_urls=()

      # Lecture ligne par ligne des noms d'outils
      while IFS= read -r line; do
        [[ -n "$line" ]] && tool_names+=("$line")
      done <<< "$tool_names_raw"

      # Lecture ligne par ligne des URLs
      while IFS= read -r line; do
        [[ -n "$line" ]] && tool_urls+=("$line")
      done <<< "$tool_urls_raw"

      # Vérification que les tableaux ont la même taille
      if [ ${#tool_names[@]} -ne ${#tool_urls[@]} ]; then
        echo "❌ Erreur: Le nombre de noms d'outils (${#tool_names[@]}) ne correspond pas au nombre d'URLs (${#tool_urls[@]})"
        exit 1
      fi

      # Compteurs
      downloaded=0
      skipped=0
      errors=0

      # Téléchargement de chaque outil
      for i in "${!tool_names[@]}"; do
        tool="${tool_names[$i]}"
        url="${tool_urls[$i]}"
        target_file="$tools_dir/$tool"
        
        echo -n "⬇️  $tool ... "
        
        # Vérifier si le fichier existe déjà
        if [ -f "$target_file" ] && [ "{{.FORCE}}" != "true" ]; then
          echo "⏭️  déjà présent"
          skipped=$((skipped + 1))
          continue
        fi
        
        # Télécharger le fichier (--fail : échec propre sur HTTP d'erreur au lieu d'un .phar corrompu)
        if curl -fsSL -o "$target_file" "$url"; then
          # Vérifier que le téléchargement a réussi
          if [ -f "$target_file" ] && [ -s "$target_file" ]; then
            # Vérification SHA256 avant chmod +x (si somme renseignée, sinon ignorée)
            case "$tool" in
              "phploc.phar") expected_sha="{{.PHPLOC_SHA256}}" ;;
              "php-cs-fixer.phar") expected_sha="{{.PHP_CS_FIXER_SHA256}}" ;;
              "phpmd.phar") expected_sha="{{.PHPMD_SHA256}}" ;;
              "phpcbf.phar") expected_sha="{{.PHP_CODESNIFFER_PHPCBF_SHA256}}" ;;
              "phpcs.phar") expected_sha="{{.PHP_CODESNIFFER_PHPCS_SHA256}}" ;;
              "phpstan.phar") expected_sha="{{.PHPSTAN_SHA256}}" ;;
              "phpDocumentor.phar") expected_sha="{{.PHPDOCUMENTOR_SHA256}}" ;;
              "behat.phar") expected_sha="{{.BEHAT_SHA256}}" ;;
              *) expected_sha="" ;;
            esac
            if [ -n "$expected_sha" ]; then
              if ! command -v sha256sum >/dev/null 2>&1; then
                echo "❌ échec (sha256sum manquant pour vérifier $tool)"
                rm -f "$target_file"
                errors=$((errors + 1))
                continue
              fi
              if echo "$expected_sha  $target_file" | sha256sum -c - >/dev/null 2>&1; then
                echo -n "(sha256 ok) "
              else
                echo "❌ échec (SHA256 mismatch pour $tool)"
                rm -f "$target_file"
                errors=$((errors + 1))
                continue
              fi
            fi
            # Rendre le fichier exécutable
            chmod +x "$target_file"
            echo "✅ téléchargé"
            downloaded=$((downloaded + 1))
          else
            echo "❌ échec (fichier vide)"
            rm -f "$target_file"
            errors=$((errors + 1))
          fi
        else
          echo "❌ échec du téléchargement"
          rm -f "$target_file"
          errors=$((errors + 1))
        fi
      done

      echo ""
      echo "📊 Résumé :"
      echo "  ✅ Téléchargés: $downloaded"
      echo "  ⏭️  Ignorés: $skipped"
      echo "  ❌ Erreurs: $errors"
      echo ""

      if [ $downloaded -gt 0 ]; then
        echo "📁 Outils disponibles dans '$tools_dir' :"
        ls -la "$tools_dir"/*.phar 2>/dev/null | awk '{print "  " $9 " (" $5 " bytes)"}'
      fi

      if [ $errors -gt 0 ]; then
        echo ""
        echo "⚠️  Certains téléchargements ont échoué. Vérifiez votre connexion internet."
      fi

  update:
    desc: "Met à jour tous les outils PHP (force le téléchargement)"
    silent: true
    summary: |
      Force la mise à jour de tous les outils PHP même s'ils existent déjà.

      Variables:
      - TOOLS_DIR: Dossier de destination (défaut: ./tools/php)

      Exemple:
      task download:php:update
    vars:
      TOOLS_DIR: '{{.TOOLS_DIR | default "./tools/php"}}'
    cmds:
    - task: tools
      vars:
        TOOLS_DIR: '{{.TOOLS_DIR}}'
        FORCE: "true"

  list:
    desc: "Liste les outils PHP téléchargés"
    silent: true
    summary: |
      Affiche la liste des outils PHP présents dans le dossier.

      Variables:
      - TOOLS_DIR: Dossier à vérifier (défaut: ./tools/php)
    vars:
      TOOLS_DIR: '{{.TOOLS_DIR | default "./tools/php"}}'
    cmds:
    - |
      # Racine du projet : git toplevel si dispo, sinon TASKFILE_DIR/../.. (ce fichier vit à download/php/)
      if git rev-parse --show-toplevel >/dev/null 2>&1; then
        project_root=$(git rev-parse --show-toplevel)
      else
        project_root="$(cd "{{.TASKFILE_DIR}}/../.." && pwd)"
      fi

      # Déterminer le chemin absolu du dossier de destination
      if [[ "{{.TOOLS_DIR}}" == /* ]]; then
        # Chemin absolu fourni
        tools_dir="{{.TOOLS_DIR}}"
      else
        # Chemin relatif fourni - le baser sur la racine du projet
        tools_dir="$project_root/{{.TOOLS_DIR}}"
      fi

      if [ ! -d "$tools_dir" ]; then
        echo "❌ Le dossier '$tools_dir' n'existe pas"
        echo "💡 Utilisez 'task download:php:tools' pour télécharger les outils"
        exit 1
      fi

      echo "📁 Outils PHP dans '$tools_dir' :"
      echo ""

      # Conversion de la variable en tableau (suppression des retours à la ligne)
      tool_names_raw="{{.PHP_TOOLS_NAMES}}"
      tool_names=()

      # Lecture ligne par ligne des noms d'outils
      while IFS= read -r line; do
        [[ -n "$line" ]] && tool_names+=("$line")
      done <<< "$tool_names_raw"

      total_tools=${#tool_names[@]}
      tools_found=0

      for tool in "${tool_names[@]}"; do
        if [ -f "$tools_dir/$tool" ]; then
          size=$(ls -lh "$tools_dir/$tool" | awk '{print $5}')
          perms=$(ls -l "$tools_dir/$tool" | awk '{print $1}')
          echo "  ✅ $tool ($size) $perms"
          tools_found=$((tools_found + 1))
        else
          echo "  ❌ $tool (manquant)"
        fi
      done

      echo ""
      echo "📊 $tools_found/$total_tools outils présents"

      if [ $tools_found -lt $total_tools ]; then
        echo ""
        echo "💡 Pour télécharger les outils manquants :"
        echo "   task download:php:tools"
      fi

  checksum:
    desc: "Affiche les SHA256 des outils téléchargés (pour remplir *_SHA256)"
    silent: true
    summary: |
      Calcule les SHA256 des .phar présents pour verrouiller la chaîne
      d'approvisionnement : relancez ensuite `tools` avec les sommes affichées
      (ex. task download:php:tools PHPSTAN_SHA256=<sha>).

      Les sommes officielles sont aussi publiées sur les pages GitHub Releases
      des outils — ne reprenez une somme locale que pour un binaire téléchargé
      depuis l'URL officielle en HTTPS.

      Variables:
      - TOOLS_DIR: Dossier à vérifier (défaut: ./tools/php)
    vars:
      TOOLS_DIR: '{{.TOOLS_DIR | default "./tools/php"}}'
    preconditions:
    - sh: command -v sha256sum
      msg: "sha256sum est requis pour calculer les sommes"
    cmds:
    - |
      # Racine du projet : git toplevel si dispo, sinon TASKFILE_DIR/../.. (ce fichier vit à download/php/)
      if git rev-parse --show-toplevel >/dev/null 2>&1; then
        project_root=$(git rev-parse --show-toplevel)
      else
        project_root="$(cd "{{.TASKFILE_DIR}}/../.." && pwd)"
      fi
      if [[ "{{.TOOLS_DIR}}" == /* ]]; then
        tools_dir="{{.TOOLS_DIR}}"
      else
        tools_dir="$project_root/{{.TOOLS_DIR}}"
      fi
      if [ ! -d "$tools_dir" ]; then
        echo "❌ Le dossier '$tools_dir' n'existe pas"
        exit 1
      fi
      tool_names_raw="{{.PHP_TOOLS_NAMES}}"
      while IFS= read -r tool; do
        [ -z "$tool" ] && continue
        case "$tool" in
          "phploc.phar") var="PHPLOC_SHA256" ;;
          "php-cs-fixer.phar") var="PHP_CS_FIXER_SHA256" ;;
          "phpmd.phar") var="PHPMD_SHA256" ;;
          "phpcbf.phar") var="PHP_CODESNIFFER_PHPCBF_SHA256" ;;
          "phpcs.phar") var="PHP_CODESNIFFER_PHPCS_SHA256" ;;
          "phpstan.phar") var="PHPSTAN_SHA256" ;;
          "phpDocumentor.phar") var="PHPDOCUMENTOR_SHA256" ;;
          "behat.phar") var="BEHAT_SHA256" ;;
          *) var="UNKNOWN" ;;
        esac
        if [ -f "$tools_dir/$tool" ]; then
          sum=$(sha256sum "$tools_dir/$tool" | awk '{print $1}')
          echo "$var=\"$sum\"  # $tool"
        else
          echo "# $tool manquant — var $var non calculable"
        fi
      done <<< "$tool_names_raw"

  clean:
    desc: "Supprime tous les outils PHP téléchargés"
    silent: true
    summary: |
      Supprime le dossier contenant les outils PHP.

      Variables:
      - TOOLS_DIR: Dossier à supprimer (défaut: ./tools/php)

      ⚠️  ATTENTION: Cette action est irréversible !
    vars:
      TOOLS_DIR: '{{.TOOLS_DIR | default "./tools/php"}}'
      FORCE: '{{.FORCE | default "false"}}'
    cmds:
    - |
      # Racine du projet : git toplevel si dispo, sinon TASKFILE_DIR/../.. (ce fichier vit à download/php/)
      if git rev-parse --show-toplevel >/dev/null 2>&1; then
        project_root=$(git rev-parse --show-toplevel)
      else
        project_root="$(cd "{{.TASKFILE_DIR}}/../.." && pwd)"
      fi

      # Déterminer le chemin absolu du dossier de destination
      if [[ "{{.TOOLS_DIR}}" == /* ]]; then
        # Chemin absolu fourni
        tools_dir="{{.TOOLS_DIR}}"
      else
        # Chemin relatif fourni - le baser sur la racine du projet
        tools_dir="$project_root/{{.TOOLS_DIR}}"
      fi

      if [ ! -d "$tools_dir" ]; then
        echo "❌ Le dossier '$tools_dir' n'existe pas"
        exit 1
      fi

      echo "🗑️  Suppression du dossier '$tools_dir' et de tous les outils..."
      # Confirmation (sauf FORCE=true ; échec rapide en non-interactif au lieu de hang)
      if [ "{{.FORCE}}" = "true" ]; then
        rm -rf "$tools_dir"
        echo "✅ Dossier supprimé (FORCE=true)"
      elif [ ! -t 0 ]; then
        echo "❌ Entrée non-interactive détectée : relancez avec FORCE=true pour confirmer (ou en interactif)"
        exit 1
      else
        read -p "Êtes-vous sûr ? [y/N] " -n 1 -r
        echo
        if [[ $REPLY =~ ^[Yy]$ ]]; then
          rm -rf "$tools_dir"
          echo "✅ Dossier supprimé"
        else
          echo "❌ Suppression annulée"
        fi
      fi
