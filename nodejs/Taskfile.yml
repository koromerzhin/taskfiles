version: 3
# Taskfile pour les projets Node.js

vars:
  DEV_DEPS: '{{.DEV_DEPS | default "all-contributors-cli cypress generate-changelog gitmoji-changelog jscpd license-checker markdownlint-cli npm-run-all readme-md-generator semantic-git-commit-cli yaml"}}'

tasks:
  install:
    desc: "Installe les dépendances Node.js"
    silent: true
    preconditions:
    - sh: command -v npm
    - sh: "test -f package.json"
      msg: "Le fichier package.json est requis pour cette tâche"
    cmds:
    - npm install
  init:
    desc: "Initialise le projet Node.js en installant les dépendances"
    silent: true
    preconditions:
    - sh: command -v npm
    cmds:
    - npm init -y

  add-dev-deps:
    desc: "Ajoute les devDependencies communes si elles ne sont pas déjà présentes"
    silent: true
    preconditions:
    - sh: command -v npm
      msg: "npm n'est pas installé ou accessible"
    - sh: "test -f package.json"
      msg: "Le fichier package.json est requis pour cette tâche"
    cmds:
    - |
      echo "📦 Installation des devDependencies communes..."
      echo "📋 Liste: {{.DEV_DEPS}} (surchargeable via DEV_DEPS=\"...\")"
      echo ""

      # Liste des packages (var DEV_DEPS, même défaut qu'avant : comportement inchangé sans surcharge)
      packages="{{.DEV_DEPS}}"

      # Collecte des manquants puis installation en une seule passe (déterministe, rapide)
      missing=""
      added=0
      skipped=0

      for package_name in $packages; do
        # Vérifie si le package est déjà dans devDependencies
        if ! npm pkg get devDependencies | grep -q "\"$package_name\""; then
          missing="$missing $package_name"
        else
          echo "⏭️  $package_name est déjà installé, ignoré."
          skipped=$((skipped + 1))
        fi
      done

      if [ -n "$missing" ]; then
        echo "📦 Installation de:$missing"
        if npm install --save-dev $missing; then
          added=$(echo "$missing" | wc -w)
        else
          echo "❌ Erreur lors de l'installation de:$missing"
        fi
      fi

      echo ""
      echo "📊 Résumé :"
      echo "  ✅ Ajoutées: $added"
      echo "  ⏭️  Ignorées: $skipped"
      echo "✅ Installation des devDependencies terminée."
